<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3b5c"/>
      <stop offset="1" stop-color="#5c7cff"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a26"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)" stroke="#26263a" stroke-width="2"/>

  <!-- skull: rounded cranium blending into a rounded jaw -->
  <path d="M64 20
           C 90 20 104 40 104 60
           C 104 76 96 86 88 92
           C 88 100 82 108 64 108
           C 46 108 40 100 40 92
           C 32 86 24 76 24 60
           C 24 40 38 20 64 20 Z"
        fill="#e8e8f0"/>

  <!-- eye sockets -->
  <ellipse cx="48" cy="58" rx="11" ry="14" fill="#0d0d14"/>
  <ellipse cx="80" cy="58" rx="11" ry="14" fill="#0d0d14"/>

  <!-- nasal cavity -->
  <path d="M64 68 L57 82 L71 82 Z" fill="#0d0d14"/>

  <!-- mouth / teeth line -->
  <rect x="50" y="92" width="28" height="5" rx="2.5" fill="#0d0d14"/>

  <!-- forge spark accent -->
  <circle cx="64" cy="12" r="4" fill="url(#accent)"/>
</svg>
